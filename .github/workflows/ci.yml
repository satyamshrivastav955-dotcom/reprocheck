name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-self-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: Install pinned Python
        run: uv python install 3.12
      - name: Sync locked development environment
        run: uv sync --locked --dev
      - name: Run canonical tests
        run: make test
      - name: Run ReproCheck self-scan
        run: uv run reprocheck scan . --format json --fail-on critical --output self-scan.json
      - name: Upload self-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reprocheck-self-scan
          path: self-scan.json
